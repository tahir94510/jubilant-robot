# Quotecrack CI/CD
#
# Her push'ta: analiz + testler + indirilebilir debug APK + web onizleme
# (GitHub Pages). KEYSTORE_BASE64 secret'i tanimliysa Play Store'a
# yuklenecek IMZALI release AAB da uretilir (Actions > calisma > Artifacts).
#
# Kurulumunuz icin tek seferlik adimlar: docs/YAYINLAMA_REHBERI.md
name: CI

# Yalnizca push: bu repoda her PR'in head dali zaten main/claude/** ile
# eslesir ve push kosusunun sonuclari PR sayfasinda gorunur. Eski
# `pull_request` tetikleyicisi, PR acikken ayni commit'i IKINCI kez
# kosturuyordu (cift CI) — bilincli olarak kaldirildi.
on:
  push:
    branches: [main, 'claude/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Node 20 kullanim-disi uyarilarini susturur; tum action'lar Node 24 ile
# kosar (16 Haziran 2026'da zaten varsayilan oluyor).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      # `preview`-tagged tests are local-only asset generators (store
      # screenshots, design previews) that write golden PNGs; they are not
      # correctness tests and their goldens are environment-sensitive, so keep
      # them out of CI. They still pass analyze + format above.
      - run: flutter test --reporter expanded --exclude-tags preview

  check-secrets:
    name: Check signing secrets
    runs-on: ubuntu-latest
    outputs:
      has-keystore: ${{ steps.chk.outputs.has }}
    steps:
      - id: chk
        env:
          HAS: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "has=$HAS" >> "$GITHUB_OUTPUT"

  build-apk-debug:
    name: Debug APK (telefonda deneme icin)
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      # fetch-depth: 0 -> tam gecmis, boylece `git rev-list --count HEAD` gercek
      # commit sayisini verir (shallow klonda 1 donerdi). Bu sayi versionCode olur.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # versionCode = commit sayisi (monoton artar) -> her push benzersiz, artan
      # bir Play versionCode'u uretir; ELLE sürüm bumplamaya gerek kalmaz.
      - run: flutter build apk --debug --build-number=$(git rev-list --count HEAD)
      - uses: actions/upload-artifact@v7
        with:
          name: quotecrack-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  build-aab-release:
    name: Signed release AAB (Play Store)
    runs-on: ubuntu-latest
    needs: [analyze-test, check-secrets]
    if: needs.check-secrets.outputs.has-keystore == 'true'
    steps:
      # fetch-depth: 0 -> `git rev-list --count HEAD` gercek commit sayisini
      # (versionCode) versin; shallow klonda 1 doner ve Play yuklemesi reddederdi.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Materialize signing config from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      # versionCode = commit sayisi (monoton artar): her CI derlemesi Play'e
      # yuklenebilir benzersiz, artan bir koda sahip; ELLE bumplama YOK.
      - run: flutter build appbundle --release --build-number=$(git rev-list --count HEAD)
      - uses: actions/upload-artifact@v7
        with:
          name: quotecrack-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
      # Ayni imzayla release APK: magazaya gidecek paketi telefonda birebir
      # dogrulamak icin. DIKKAT: gercek reklam kimlikleri aktiftir; kendi
      # reklamlariniza TIKLAMAYIN (docs/YAYINLAMA_REHBERI.md).
      - run: flutter build apk --release --build-number=$(git rev-list --count HEAD)
      - uses: actions/upload-artifact@v7
        with:
          name: quotecrack-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # Web onizleme, GitHub Pages ACIKSA yayinlanir. Pages'i acmak tek tik:
  #   Repo > Settings > Pages > Source: "GitHub Actions"
  # (Ucretsiz hesaplarda Pages yalnizca PUBLIC repolarda calisir; once
  #  Settings > General > Danger Zone > Change visibility > Public yapin.)
  # Pages kapaliyken bu isler sessizce atlanir ve CI yesil kalir.
  build-web:
    name: Web preview build
    runs-on: ubuntu-latest
    needs: analyze-test
    permissions:
      pages: write
      contents: read
    outputs:
      pages-enabled: ${{ steps.cfg.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # --pwa-strategy=none: service worker olmasin ki onizleme asla
      # bayat (eski) surumde takili kalmasin. base-href repo adindan TURETILIR
      # (rename-proof): repo adi ne olursa olsun flutter_bootstrap.js dogru
      # yoldan yuklenir; sabit bir yol yeniden adlandirmada 404 verip
      # "loading"de takiyordu.
      # --no-web-resources-cdn: CanvasKit + fontlari gstatic CDN'inden DEGIL kendi
      # Pages origin'imizden servis et. gstatic'ten canvaskit cekimi takilinca/
      # basarisiz olunca uygulama boot-splash'ta ASILI kaliyordu (first-frame hic
      # atesle(n)miyordu) — kullanicinin gordugu "loading'de takili" tam buydu.
      # Self-host ile harici CDN bagimliligi kalkar, her sey ayni-origin yuklenir.
      # --wasm: 2026'nin onerilen web yolu — cift derleme uretir. WasmGC
      # destekleyen tarayicilar (Firefox 120+, Chrome, Edge) COK daha hizli
      # skwasm motorunu alir; digerleri OTOMATIK olarak dart2js+canvaskit'e
      # duser (kimse icin gerileme yok). Sebep: dart2js+canvaskit yolu
      # Firefox'ta ana is parcacigini boguyordu ("bu sayfa Firefox'u
      # yavaslatiyor" + sonsuz splash); ayni build Chromium'da acili(yor)du —
      # yerel gercek-tarayici reproduksiyonuyla kanitlandi. GitHub Pages
      # COOP/COEP gondermez -> skwasm tek-is-parcacikli varyanti kullanilir
      # (Flutter 3.32+ otomatik), ekstra baslik gerekmez.
      - run: >
          flutter build web --wasm --release
          --base-href "/${{ github.event.repository.name }}/app/"
          --pwa-strategy=none
          --no-web-resources-cdn
      - name: Assemble Pages site (landing + privacy + app)
        # Landing/SEO URL'leri (canonical/og/manifest/sitemap/404) kaynakta
        # dogrudan "quotecrack" olarak yazili; uygulamanin YUKLENME yolu
        # (base-href) yukarida repo adindan turetildigi icin kritik yol zaten
        # rename-proof. (Repo bir daha yeniden adlandirilirsa landing URL'leri
        # pages/ + web/ altinda tek find-replace ile guncellenir.)
        run: |
          mkdir -p _site/app
          cp -r build/web/* _site/app/
          cp -r pages/* _site/
          # Kozmetik: release derlemesi kaynak haritalarini (flutter.js.map vb.)
          # GONDERMEZ ama JS dosyalari hala `//# sourceMappingURL=...` yorumu
          # tasir; devtools bu haritayi cekmeye calisip 404 yaziyor (kullanicinin
          # gordugu "hata"). Sadece bu debug yorumunu sil — islevsel etki YOK,
          # konsol temizlenir. canvaskit alt klasoru haric (oradaki uyari WebGL
          # deprecation, kaynak-harita degil).
          find _site/app -maxdepth 1 -name '*.js' \
            -exec sed -i '/sourceMappingURL/d' {} +
      - id: cfg
        uses: actions/configure-pages@v6
        continue-on-error: true
      - if: steps.cfg.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - if: steps.cfg.outcome != 'success'
        run: >
          echo "::notice title=Web onizleme atlandi::GitHub Pages bu repoda
          kapali. Acmak icin repoyu Public yapin ve Settings > Pages >
          Source: GitHub Actions secin. Detay: README.md"

  deploy-pages:
    name: Deploy web preview
    runs-on: ubuntu-latest
    needs: build-web
    # Yalniz varsayilan dalda: github-pages ortam korumasi diger dallardan
    # dagitimi reddediyor (calisma dali degisince is 2 saniyede runner'siz
    # dusuyordu). Derleme dogrulamasi (build-web) her dalda kosmaya devam
    # eder; onizleme, is varsayilan dala indiginde guncellenir.
    if: >
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.build-web.outputs.pages-enabled == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
