# Imza anahtari (keystore) ureticisi - TEK SEFERLIK manuel calistirilir.
#
# Nasil kullanilir (ayrintili anlatim: docs/YAYINLAMA_REHBERI.md):
#   1. GitHub > Actions > "Generate signing keystore" > Run workflow
#   2. Bittiginde calismaya girin, "signing-keys" artefaktini indirin
#   3. Icindeki OKUBENI.txt'deki 4 degeri repo Settings > Secrets and
#      variables > Actions altina secret olarak ekleyin:
#        KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#   4. upload-keystore.jks + parolalari KALICI ve GUVENLI bir yere de
#      kaydedin (parola yoneticisi vb.), sonra artefakti SILIN.
#
# GUVENLIK NOTU: Artefaktlar yalnizca repo yetkililerine gorunur ve 7 gun
# sonra otomatik silinir; yine de degerleri secret'lara tasiyip artefakti
# elle silmek en iyi pratiktir.
name: Generate signing keystore

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: Key alias
        default: quotecrack
        required: true
      validity_years:
        description: Validity (years)
        default: '30'
        required: true
      common_name:
        description: Certificate CN (your or app name)
        default: Quotecrack
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore and instructions
        env:
          ALIAS: ${{ inputs.key_alias }}
          YEARS: ${{ inputs.validity_years }}
          CN: ${{ inputs.common_name }}
        run: |
          set -euo pipefail
          mkdir -p out
          # Modern keytool PKCS12 uretir ve PKCS12'de depo/anahtar parolasi
          # AYNI olmak zorundadir - tek parola uretip ikisinde de kullaniyoruz.
          STORE_PASS=$(openssl rand -base64 18 | tr -d '/+=' )
          KEY_PASS="$STORE_PASS"
          keytool -genkeypair \
            -keystore out/upload-keystore.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity $(( YEARS * 365 )) \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=$CN"
          base64 -w0 out/upload-keystore.jks > out/keystore-base64.txt
          {
            echo "QUOTECRACK IMZA ANAHTARI - $(date -u +%F)"
            echo
            echo "Asagidaki 4 degeri GitHub repo > Settings > Secrets and"
            echo "variables > Actions > 'New repository secret' ile ekleyin:"
            echo
            echo "1) KEYSTORE_BASE64  -> keystore-base64.txt dosyasinin TUM icerigi"
            echo "2) KEYSTORE_PASSWORD -> $STORE_PASS"
            echo "3) KEY_ALIAS         -> $ALIAS"
            echo "4) KEY_PASSWORD      -> $KEY_PASS"
            echo "   (PKCS12 geregi 2 ile 4 ayni degerdir - ikisine de bunu girin)"
            echo
            echo "SONRA:"
            echo "- upload-keystore.jks + bu parolalari kalici guvenli bir"
            echo "  yere kaydedin (parola yoneticisi onerilir)."
            echo "- Bu artefakti GitHub'dan SILIN."
            echo
            echo "Bu anahtar Play Store'a yukleme anahtarinizdir; kaybederseniz"
            echo "Play App Signing sayesinde Google destegiyle sifirlanabilir,"
            echo "ama en iyisi hic kaybetmemektir."
          } > out/OKUBENI.txt
      - uses: actions/upload-artifact@v5
        with:
          name: signing-keys
          path: out/
          retention-days: 7
