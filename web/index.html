<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The base href placeholder is replaced by the value of the `--base-href`
    argument provided to `flutter build` (CI uses /quotecrack/app/).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Without this, phones lay the boot splash out at desktop width and
       scale it down — tiny, blurry branding before the engine loads. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Quotecrack: decode famous quotes with daily cryptogram puzzles. Free, offline word puzzles: cryptoquotes, ciphers, streaks, and achievements.">
  <meta name="keywords" content="cryptogram, cryptoquote, cipher puzzle, word puzzle, quote game, daily puzzle">
  <link rel="canonical" href="https://tahir94510.github.io/quotecrack/app/">

  <!-- Social cards -->
  <meta property="og:title" content="Quotecrack: Cryptogram Puzzles">
  <meta property="og:description" content="Decode famous quotes. One cipher a day.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tahir94510.github.io/quotecrack/app/">
  <meta property="og:image" content="https://tahir94510.github.io/quotecrack/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Quotecrack: Cryptogram Puzzles">
  <meta name="twitter:description" content="Decode famous quotes. One cipher a day.">
  <meta name="twitter:image" content="https://tahir94510.github.io/quotecrack/og-image.png">

  <!-- Browser chrome matches the light "paper" brand splash while loading. -->
  <meta name="theme-color" content="#F7F4EC">
  <!-- Force a LIGHT page canvas: without this, a dark-mode browser paints the
       page (the area behind/around the Flutter view and during the splash
       fade) BLACK, so first launch flashed a black background behind the logo.
       The app still renders its own dark theme inside the Flutter canvas. -->
  <meta name="color-scheme" content="light">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Quotecrack">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon: SVG first (crisp at any size), PNG fallback. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Quotecrack: Cryptogram Puzzles</title>
  <link rel="manifest" href="manifest.json">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Quotecrack",
    "url": "https://tahir94510.github.io/quotecrack/app/",
    "image": "https://tahir94510.github.io/quotecrack/og-image.png",
    "description": "Decode famous quotes with daily cryptogram puzzles. Free offline word puzzles: cryptoquotes, ciphers, streaks and achievements.",
    "applicationCategory": "GameApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requires JavaScript",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>

  <style>
    /* Cream page canvas in every mode: the host page (behind the Flutter view,
       during the splash fade, and on scroll-bounce) must never be the
       dark-mode browser default (black) — that was the black flash behind the
       launch logo. color-scheme:light keeps form controls/scrollbars light too;
       Flutter still paints the user's chosen theme inside its own canvas. */
    :root { color-scheme: light; }
    html, body { margin: 0; padding: 0; background-color: #F7F4EC; }
    /* Branded splash while the engine loads: vector logo + serif wordmark,
       all inline (zero extra requests), crisp at any DPI. */
    #boot-splash {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 0;
      background: linear-gradient(135deg, #F7F4EC, #EAE1CE);
      color: #211E1A; font-family: system-ui, sans-serif;
      transition: opacity .45s ease; z-index: 10;
    }
    #boot-splash .brand {
      display: flex; flex-direction: column; align-items: center;
      animation: boot-in .45s ease-out both;
    }
    #boot-splash .brand svg { display: block; }
    #boot-splash .wordmark {
      margin-top: 18px; font-size: 2rem; font-weight: 700;
      letter-spacing: -.5px;
      font-family: Georgia, 'Times New Roman', serif;
    }
    #boot-splash .tagline { margin-top: 6px; opacity: .7; font-size: .95rem; }
    #boot-splash .dots { display: flex; gap: 6px; margin-top: 22px; }
    #boot-splash .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #966E1E;
      animation: boot-pulse 1.2s ease-in-out infinite;
    }
    #boot-splash .dot:nth-child(2) { animation-delay: .2s; }
    #boot-splash .dot:nth-child(3) { animation-delay: .4s; }
    /* Shown only by the watchdog if the engine never paints (stale cache /
       flaky network) — a way out instead of staring at the dots forever. */
    #boot-splash #boot-hint { margin-top: 20px; font-size: .9rem; opacity: .7; }
    #boot-splash #boot-reload {
      margin-top: 12px; padding: 8px 22px; font: inherit; font-size: .95rem;
      color: #F7F4EC; background: #966E1E; border: none; border-radius: 999px;
      cursor: pointer;
    }
    #boot-splash [hidden] { display: none; }
    @keyframes boot-pulse {
      0%, 80%, 100% { opacity: .25; transform: scale(.8); }
      40% { opacity: 1; transform: scale(1); }
    }
    @keyframes boot-in {
      from { opacity: 0; transform: translateY(8px) scale(.98); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash .dot { animation: none; opacity: .7; }
      #boot-splash .brand { animation: none; }
    }
  </style>
</head>
<body>
  <div id="boot-splash">
    <div class="brand">
      <!-- Transparent mark (no baked tile), matching the in-app BrandMark. The
           boot canvas is a fixed light "paper" gradient, so the dark-ink Q and
           gold accents read cleanly straight on it — no card, no shadow. -->
      <svg width="104" height="104" viewBox="0 0 96 96" role="img" aria-label="Quotecrack logo">
        <text x="42" y="40" font-family="Georgia,'Times New Roman',serif" font-weight="600" font-size="54" fill="#26221C" text-anchor="middle" dominant-baseline="central">Q</text>
        <text x="73" y="28" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="23" fill="#AA7C22" text-anchor="middle" dominant-baseline="central">?</text>
        <rect x="19.2" y="74.4" width="57.6" height="4.8" rx="2.4" fill="#966E1E"/>
      </svg>
      <div class="wordmark">Quotecrack</div>
      <div class="tagline">Decode famous quotes.</div>
    </div>
    <div class="dots" role="status" aria-label="Loading">
      <div class="dot" aria-hidden="true"></div>
      <div class="dot" aria-hidden="true"></div>
      <div class="dot" aria-hidden="true"></div>
    </div>
    <div id="boot-hint" hidden>Taking longer than usual…</div>
    <button id="boot-reload" type="button" hidden onclick="location.reload()">Reload</button>
  </div>
  <noscript>
    Quotecrack is a free, offline cryptogram puzzle game. It needs
    JavaScript to run in the browser, or get it on Google Play.
  </noscript>
  <script>
    // Self-heal: a service worker or cache left by an OLD build could keep
    // serving a stale/broken bundle even after the site is fixed — a classic
    // cause of "stuck on the loading splash". We ship no service worker
    // (--pwa-strategy=none), so unregister any a past build registered and drop
    // its caches. A no-op when there are none, so it is always safe to run.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); })
        .catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys()
        .then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); })
        .catch(function () {});
    }
    // Drop the boot splash the instant Flutter paints its first frame.
    var _booted = false;
    window.addEventListener('flutter-first-frame', function () {
      _booted = true;
      var el = document.getElementById('boot-splash');
      if (el) { el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 500); }
    });
    // Watchdog: if the engine still hasn't painted after 15s the bundle likely
    // failed to load. Reveal a manual reload instead of an endless spinner. No
    // automatic reload — that could loop on a genuinely slow (but working) load.
    setTimeout(function () {
      if (_booted) return;
      var hint = document.getElementById('boot-hint');
      var btn = document.getElementById('boot-reload');
      if (hint) hint.hidden = false;
      if (btn) btn.hidden = false;
    }, 15000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
