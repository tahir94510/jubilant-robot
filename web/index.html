<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The base href placeholder is replaced by the value of the `--base-href`
    argument provided to `flutter build` (CI uses /quotecrack/app/).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Without this, phones lay the boot splash out at desktop width and
       scale it down — tiny, blurry branding before the engine loads. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Quotecrack: decode famous quotes with daily cryptogram puzzles. Free, offline word puzzles: cryptoquotes, ciphers, streaks, and achievements.">
  <meta name="keywords" content="cryptogram, cryptoquote, cipher puzzle, word puzzle, quote game, daily puzzle">
  <link rel="canonical" href="https://tahir94510.github.io/quotecrack/app/">

  <!-- Social cards -->
  <meta property="og:title" content="Quotecrack: Cryptogram Puzzles">
  <meta property="og:description" content="Decode famous quotes. One cipher a day.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tahir94510.github.io/quotecrack/app/">
  <meta property="og:image" content="https://tahir94510.github.io/quotecrack/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Quotecrack: Cryptogram Puzzles">
  <meta name="twitter:description" content="Decode famous quotes. One cipher a day.">
  <meta name="twitter:image" content="https://tahir94510.github.io/quotecrack/og-image.png">

  <!-- Browser chrome matches the brand splash while loading; overridden below
       (before first paint) when the player's saved theme is Dark/Sepia or
       their browser prefers dark and they haven't overridden it to Light. -->
  <meta name="theme-color" content="#F7F4EC" id="boot-theme-color">
  <!-- Base LIGHT page canvas: without this, a dark-mode browser paints the
       page (the area behind/around the Flutter view and during the splash
       fade) BLACK, so first launch flashed a black background behind the logo.
       The inline script below swaps this to "dark" before first paint when the
       player's saved theme calls for it, so the boot canvas matches instead of
       always flashing light. The app still renders its own theme inside the
       Flutter canvas regardless. -->
  <meta name="color-scheme" content="light" id="boot-color-scheme">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Quotecrack">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon: SVG first (crisp at any size), PNG fallback. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Quotecrack: Cryptogram Puzzles</title>
  <link rel="manifest" href="manifest.json">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Quotecrack",
    "url": "https://tahir94510.github.io/quotecrack/app/",
    "image": "https://tahir94510.github.io/quotecrack/og-image.png",
    "description": "Decode famous quotes with daily cryptogram puzzles. Free offline word puzzles: cryptoquotes, ciphers, streaks and achievements.",
    "applicationCategory": "GameApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requires JavaScript",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>

  <style>
    /* Cream page canvas by default: the host page (behind the Flutter view,
       during the splash fade, and on scroll-bounce) must never be the
       dark-mode browser default (black) — that was the black flash behind the
       launch logo. These are CSS custom properties (not fixed colors) so the
       inline script below can repaint them, before the first frame, to match
       the player's SAVED in-app theme (Dark/Sepia) or their browser's dark
       preference under "System" — otherwise a Dark/Sepia player saw a light
       flash on every load, which read as "the theme doesn't work". color-
       scheme stays a plain default here; the script flips it to dark via
       #boot-color-scheme when needed. Flutter still paints the user's chosen
       theme inside its own canvas regardless of these fallbacks. */
    :root {
      --boot-bg: #F7F4EC;
      --boot-splash-to: #EAE1CE;
      --boot-text: #211E1A;
      --boot-accent: #966E1E;
      --boot-reload-text: #F7F4EC;
      color-scheme: light;
    }
    html, body { margin: 0; padding: 0; background-color: var(--boot-bg); }
    /* Branded splash while the engine loads: vector logo + serif wordmark,
       all inline (zero extra requests), crisp at any DPI. */
    #boot-splash {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 0;
      background: linear-gradient(135deg, var(--boot-bg), var(--boot-splash-to));
      color: var(--boot-text); font-family: system-ui, sans-serif;
      transition: opacity .45s ease, background .2s ease, color .2s ease;
      z-index: 10;
    }
    #boot-splash .brand {
      display: flex; flex-direction: column; align-items: center;
      animation: boot-in .45s ease-out both;
    }
    #boot-splash .brand svg { display: block; }
    #boot-splash .brand svg .ink { fill: var(--boot-text); }
    #boot-splash .brand svg .accent { fill: var(--boot-accent); }
    #boot-splash .wordmark {
      margin-top: 18px; font-size: 2rem; font-weight: 700;
      letter-spacing: -.5px;
      font-family: Georgia, 'Times New Roman', serif;
    }
    #boot-splash .tagline { margin-top: 6px; opacity: .7; font-size: .95rem; }
    #boot-splash .dots { display: flex; gap: 6px; margin-top: 22px; }
    #boot-splash .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--boot-accent);
      animation: boot-pulse 1.2s ease-in-out infinite;
    }
    #boot-splash .dot:nth-child(2) { animation-delay: .2s; }
    #boot-splash .dot:nth-child(3) { animation-delay: .4s; }
    /* Shown only by the watchdog if the engine never paints (stale cache /
       flaky network) — a way out instead of staring at the dots forever. */
    #boot-splash #boot-hint { margin-top: 20px; font-size: .9rem; opacity: .7; }
    #boot-splash #boot-reload {
      margin-top: 12px; padding: 8px 22px; font: inherit; font-size: .95rem;
      color: var(--boot-reload-text); background: var(--boot-accent); border: none;
      border-radius: 999px; cursor: pointer;
    }
    #boot-splash [hidden] { display: none; }
    @keyframes boot-pulse {
      0%, 80%, 100% { opacity: .25; transform: scale(.8); }
      40% { opacity: 1; transform: scale(1); }
    }
    @keyframes boot-in {
      from { opacity: 0; transform: translateY(8px) scale(.98); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash .dot { animation: none; opacity: .7; }
      #boot-splash .brand { animation: none; }
    }
  </style>
  <script>
    // Repaint the boot canvas to match the player's SAVED theme choice before
    // the first pixel is ever drawn, so Dark/Sepia players (or "System" +
    // dark browser) don't get a light flash before Flutter takes over. Reads
    // the same 'settings.v1' blob StorageService writes (shared_preferences'
    // web backend stores it in localStorage under a "flutter." prefix, as a
    // plain JSON string) — never throws, and silently keeps the light default
    // above if the value is missing, unreadable, or storage is blocked
    // (private browsing etc).
    (function () {
      try {
        var mode = 'system';
        var raw = window.localStorage && localStorage.getItem('flutter.settings.v1');
        if (raw) {
          var saved = JSON.parse(raw);
          if (saved && typeof saved.themeMode === 'string') mode = saved.themeMode;
        }
        var prefersDark = !!(
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        );
        var dark = mode === 'dark' || (mode === 'system' && prefersDark);
        var sepia = mode === 'sepia';
        if (!dark && !sepia) return; // light (or unrecognized): keep the CSS default
        var root = document.documentElement.style;
        if (sepia) {
          root.setProperty('--boot-bg', '#F4EBDC');
          root.setProperty('--boot-splash-to', '#EADFC7');
          root.setProperty('--boot-text', '#3A2E1C');
          root.setProperty('--boot-accent', '#8A6A28');
          root.setProperty('--boot-reload-text', '#FFFDF8');
        } else {
          root.setProperty('--boot-bg', '#161512');
          root.setProperty('--boot-splash-to', '#211F1A');
          root.setProperty('--boot-text', '#F2EDE2');
          root.setProperty('--boot-accent', '#D9B25A');
          root.setProperty('--boot-reload-text', '#161512');
          var colorScheme = document.getElementById('boot-color-scheme');
          if (colorScheme) colorScheme.setAttribute('content', 'dark');
          var themeColor = document.getElementById('boot-theme-color');
          if (themeColor) themeColor.setAttribute('content', '#161512');
        }
      } catch (e) {
        // Corrupt/blocked storage: fall back to the light boot canvas above.
      }
    })();
  </script>
</head>
<body>
  <div id="boot-splash">
    <div class="brand">
      <!-- Transparent mark (no baked tile), matching the in-app BrandMark.
           Ink/accent colors follow --boot-text/--boot-accent (set above) so
           the logo stays legible against the Dark/Sepia boot canvas too, not
           just the light default. -->
      <svg width="104" height="104" viewBox="0 0 96 96" role="img" aria-label="Quotecrack logo">
        <text class="ink" x="42" y="40" font-family="Georgia,'Times New Roman',serif" font-weight="600" font-size="54" text-anchor="middle" dominant-baseline="central">Q</text>
        <text class="accent" x="73" y="28" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="23" text-anchor="middle" dominant-baseline="central">?</text>
        <rect class="accent" x="19.2" y="74.4" width="57.6" height="4.8" rx="2.4"/>
      </svg>
      <div class="wordmark">Quotecrack</div>
      <div class="tagline">Decode famous quotes.</div>
    </div>
    <div class="dots" role="status" aria-label="Loading">
      <div class="dot" aria-hidden="true"></div>
      <div class="dot" aria-hidden="true"></div>
      <div class="dot" aria-hidden="true"></div>
    </div>
    <div id="boot-hint" hidden>Taking longer than usual…</div>
    <button id="boot-reload" type="button" hidden onclick="location.reload()">Reload</button>
  </div>
  <noscript>
    Quotecrack is a free, offline cryptogram puzzle game. It needs
    JavaScript to run in the browser, or get it on Google Play.
  </noscript>
  <script>
    // Self-heal: a service worker or cache left by an OLD build could keep
    // serving a stale/broken bundle even after the site is fixed — a classic
    // cause of "stuck on the loading splash". We ship no service worker
    // (--pwa-strategy=none), so unregister any a past build registered and drop
    // its caches. A no-op when there are none, so it is always safe to run.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); })
        .catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys()
        .then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); })
        .catch(function () {});
    }
    // Drop the boot splash the instant Flutter paints its first frame.
    var _booted = false;
    window.addEventListener('flutter-first-frame', function () {
      _booted = true;
      var el = document.getElementById('boot-splash');
      if (el) { el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 500); }
    });
    // Watchdog: if the engine still hasn't painted after 15s the bundle likely
    // failed to load. Reveal a manual reload instead of an endless spinner. No
    // automatic reload — that could loop on a genuinely slow (but working) load.
    setTimeout(function () {
      if (_booted) return;
      var hint = document.getElementById('boot-hint');
      var btn = document.getElementById('boot-reload');
      if (hint) hint.hidden = false;
      if (btn) btn.hidden = false;
    }, 15000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
