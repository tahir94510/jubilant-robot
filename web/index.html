<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The base href placeholder is replaced by the value of the `--base-href`
    argument provided to `flutter build` (CI uses /jubilant-robot/app/).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Without this, phones lay the boot splash out at desktop width and
       scale it down — tiny, blurry branding before the engine loads. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Quotecrack: decode famous quotes with daily cryptogram puzzles. Free, offline word puzzles: cryptoquotes, ciphers, streaks, and achievements.">
  <meta name="keywords" content="cryptogram, cryptoquote, cipher puzzle, word puzzle, quote game, daily puzzle">
  <link rel="canonical" href="https://tahir94510.github.io/jubilant-robot/app/">

  <!-- Social cards -->
  <meta property="og:title" content="Quotecrack: Cryptogram Puzzles">
  <meta property="og:description" content="Decode famous quotes. One cipher a day.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tahir94510.github.io/jubilant-robot/app/">
  <meta property="og:image" content="https://tahir94510.github.io/jubilant-robot/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Quotecrack: Cryptogram Puzzles">
  <meta name="twitter:description" content="Decode famous quotes. One cipher a day.">
  <meta name="twitter:image" content="https://tahir94510.github.io/jubilant-robot/og-image.png">

  <!-- Browser chrome matches the brand while loading. -->
  <meta name="theme-color" content="#1A1814">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Quotecrack">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon: SVG first (crisp at any size), PNG fallback. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Quotecrack: Cryptogram Puzzles</title>
  <link rel="manifest" href="manifest.json">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Quotecrack",
    "url": "https://tahir94510.github.io/jubilant-robot/app/",
    "image": "https://tahir94510.github.io/jubilant-robot/og-image.png",
    "description": "Decode famous quotes with daily cryptogram puzzles. Free offline word puzzles: cryptoquotes, ciphers, streaks and achievements.",
    "applicationCategory": "GameApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requires JavaScript",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>

  <style>
    /* Branded splash while the engine loads: vector logo + serif wordmark,
       all inline (zero extra requests), crisp at any DPI. */
    #boot-splash {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 0;
      background: linear-gradient(135deg, #1A1814, #2E2A22);
      color: #F3EEE2; font-family: system-ui, sans-serif;
      transition: opacity .45s ease; z-index: 10;
    }
    #boot-splash .brand {
      display: flex; flex-direction: column; align-items: center;
      animation: boot-in .45s ease-out both;
    }
    #boot-splash .wordmark {
      margin-top: 18px; font-size: 2rem; font-weight: 700;
      letter-spacing: -.5px;
      font-family: Georgia, 'Times New Roman', serif;
    }
    #boot-splash .tagline { margin-top: 6px; opacity: .8; font-size: .95rem; }
    #boot-splash .dots { display: flex; gap: 6px; margin-top: 22px; }
    #boot-splash .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #CBA24E;
      animation: boot-pulse 1.2s ease-in-out infinite;
    }
    #boot-splash .dot:nth-child(2) { animation-delay: .2s; }
    #boot-splash .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes boot-pulse {
      0%, 80%, 100% { opacity: .25; transform: scale(.8); }
      40% { opacity: 1; transform: scale(1); }
    }
    @keyframes boot-in {
      from { opacity: 0; transform: translateY(8px) scale(.98); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash .dot { animation: none; opacity: .7; }
      #boot-splash .brand { animation: none; }
    }
  </style>
</head>
<body>
  <div id="boot-splash">
    <div class="brand">
      <!-- The app icon, hand-drawn as inline SVG (matches
           tool/generate_icons.py geometry). -->
      <svg width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Quotecrack logo">
        <defs>
          <linearGradient id="qc-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1A1814"/>
            <stop offset="1" stop-color="#2E2A22"/>
          </linearGradient>
        </defs>
        <rect width="96" height="96" rx="21" fill="url(#qc-bg)"/>
        <text x="42" y="40" font-family="Georgia,'Times New Roman',serif" font-weight="600" font-size="54" fill="#F3EEE2" text-anchor="middle" dominant-baseline="central">Q</text>
        <text x="73" y="28" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="23" fill="#E0B85A" text-anchor="middle" dominant-baseline="central">?</text>
        <rect x="19.2" y="81" width="57.6" height="4.8" rx="2.4" fill="#CBA24E"/>
      </svg>
      <div class="wordmark">Quotecrack</div>
      <div class="tagline">Decode famous quotes.</div>
    </div>
    <div class="dots" role="status" aria-label="Loading">
      <div class="dot" aria-hidden="true"></div>
      <div class="dot" aria-hidden="true"></div>
      <div class="dot" aria-hidden="true"></div>
    </div>
  </div>
  <noscript>
    Quotecrack is a free, offline cryptogram puzzle game. It needs
    JavaScript to run in the browser, or get it on Google Play.
  </noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot-splash');
      if (el) { el.style.opacity = '0'; setTimeout(function(){ el.remove(); }, 500); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
