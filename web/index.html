<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The base href placeholder is replaced by the value of the `--base-href`
    argument provided to `flutter build` (CI uses /jubilant-robot/app/).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Quotecrack — decode famous quotes with daily cryptogram puzzles. Free offline word puzzles: cryptoquotes, ciphers, streaks and achievements.">
  <meta name="keywords" content="cryptogram, cryptoquote, cipher puzzle, word puzzle, quote game, daily puzzle">

  <!-- Social cards -->
  <meta property="og:title" content="Quotecrack — Cryptogram Puzzles">
  <meta property="og:description" content="Decode famous quotes. One cipher a day.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tahir94510.github.io/jubilant-robot/app/">
  <meta property="og:image" content="https://tahir94510.github.io/jubilant-robot/app/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- Browser chrome matches the brand while loading. -->
  <meta name="theme-color" content="#1C2541">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Quotecrack">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Quotecrack — Cryptogram Puzzles</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Simple splash while the engine loads, matching the brand gradient. */
    #boot-splash {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 12px;
      background: linear-gradient(180deg, #1C2541, #3D5A80);
      color: #F7F5F0; font-family: system-ui, sans-serif;
      transition: opacity .3s; z-index: 10;
    }
    #boot-splash .dots { display: flex; gap: 6px; margin-top: 4px; }
    #boot-splash .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #98C1D9;
      animation: boot-pulse 1.2s ease-in-out infinite;
    }
    #boot-splash .dot:nth-child(2) { animation-delay: .2s; }
    #boot-splash .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes boot-pulse {
      0%, 80%, 100% { opacity: .25; transform: scale(.8); }
      40% { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash .dot { animation: none; opacity: .7; }
    }
  </style>
</head>
<body>
  <div id="boot-splash">
    <div style="font-size:2rem;font-weight:700">Quotecrack</div>
    <div style="opacity:.8">Loading puzzles…</div>
    <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot-splash');
      if (el) { el.style.opacity = '0'; setTimeout(function(){ el.remove(); }, 350); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
