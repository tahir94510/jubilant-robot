name: quotecrack
description: "Quotecrack - decode famous quotes. A beautiful, offline cryptogram puzzle game."
publish_to: 'none'

# versionName+versionCode for Android. Bump +N for every Play Store upload.
version: 2.4.5+40

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  google_mobile_ads: ^9.0.0
  in_app_purchase: ^3.3.0
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.1
  share_plus: ^13.1.0
  in_app_review: ^2.0.10
  url_launcher: ^6.3.2
  intl: ^0.20.2
  audioplayers: ^6.7.1
  in_app_update: ^4.2.5
  # Real, amplitude-controlled vibration (Android VibrationEffect). Flutter's
  # built-in HapticFeedback maps to near-imperceptible constants on most phones;
  # HapticsService falls back to it when no controllable vibrator is present.
  vibration: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true # gen-l10n: builds AppLocalizations from lib/l10n/*.arb

  assets:
    - assets/data/quotes/
    - assets/data/quotes/tr/
    - assets/data/quotes/es/
    - assets/data/quotes/de/
    - assets/data/quotes/fr/
    - assets/data/quotes/it/
    - assets/data/quotes/pt/
    - assets/audio/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Variable.ttf
        - asset: assets/fonts/Lora-Italic-Variable.ttf
          style: italic

# NOT: Bu blok yalnız adaptif ikon bağlantısını BELGELEMEK için durur.
# `dart run flutter_launcher_icons` ÇALIŞTIRMAYIN — tüm raster'lar
# tool/generate_icons.py tarafından süper-örneklemeli üretilir ve commit'lidir;
# bu araç onların üzerine düşük kaliteli ölçekleme yazar.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  # Matches the actual committed adaptive background (@color/ic_launcher_background
  # = #F7F4EC, the light "paper" field). The dark value here was misleading: the
  # icon foreground is dark ink, designed to sit on the cream tile.
  adaptive_icon_background: "#F7F4EC"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 24
