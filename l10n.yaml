# Configures Flutter's gen-l10n. Source strings live in lib/l10n/app_en.arb;
# translations sit beside it as app_<locale>.arb. The generated
# AppLocalizations class is imported as package:quotecrack/l10n/app_localizations.dart.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
